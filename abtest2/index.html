<!doctype html>
<html lang="zh-Hans">
<head>
  <base href="/abtest2/">
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#030404"><meta name="description" content="文化程度检定：在旧 CRT 电视与时钟滴答声中，限时解读徐冰英文方块字书法作品片段。红 A、黄 B，12→10→8 秒。">
  <title>文化程度检定 · 英文方块字识读</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
</head>
<body data-phase="intro">
  <main aria-label="文化程度检定，英文方块字限时识读室"><canvas id="view" tabindex="0" aria-label="解读 CRT 电视上的书法文字；红色按钮选择 A，黄色按钮选择 B；拖动环顾"></canvas></main>
  <button id="settings-open" class="pause-control" aria-label="暂停和设置">Ⅱ <span>暂停 / Esc</span></button>
  <button id="fullscreen-toggle" class="fullscreen-control" type="button" aria-label="进入全屏" title="进入全屏"><span class="fullscreen-icon" aria-hidden="true">⛶</span><span class="fullscreen-label">全屏</span></button>
  <div class="test-hud"><span id="question-progress"></span><output id="test-clock" hidden aria-label="剩余时间"></output></div>
  <p id="reading-status" class="sr-only" role="status" aria-live="polite"></p>
  <div id="live-note" role="status" aria-live="polite"></div>
  <section id="intro" class="entry" aria-label="开始检定">
    <button id="start" class="entry-button" disabled>开始检定 <span>ENTER</span></button>
    <p id="loading">检定信号正在接收…</p><p class="source-link"><a href="./sources.html" target="_blank" rel="noopener">作品来源与阅读规则 ↗</a></p>
  </section>
  <section id="pause" class="modal" hidden aria-labelledby="pause-title">
    <div class="panel"><p class="eyebrow">SIGNAL SUSPENDED</p><h1 id="pause-title">信号已暂停。</h1>
      <p class="subtitle">倒计时与时钟声音均已暂停。</p>
      <label>VHS / CRT 信号 <output id="grain-value">85%</output><input id="grain" type="range" min="0" max="100" value="85"></label>
      <label>音量 <output id="volume-value">65%</output><input id="volume" type="range" min="0" max="100" value="65"></label>
      <label class="check"><input id="reduced" type="checkbox">减少闪烁与画面漂移</label>
      <label class="check"><input id="mute" type="checkbox">静音</label>
      <button id="resume" class="panel-button">继续检定 <span>ESC</span></button>
      <button id="restart" class="secondary">回到开始 <span>R</span></button>
      <p class="instructions">红色 A / Q，黄色 B / E<br>从左到右、从上到下、从外到里读英文<br>每题限时，超时自动记录并进入下一题<br>拖动环顾 · F 回到电视<br><a href="./sources.html" target="_blank" rel="noopener">徐冰作品来源与阅读规则 ↗</a></p>
    </div>
  </section>
  <section id="ending" class="entry" hidden aria-label="测试结束"><p id="end-description"></p><details class="review"><summary>查看本次释读记录</summary><div id="answer-review"></div></details><button id="again" class="entry-button">再检定一次 <span>ENTER</span></button></section>
  <nav id="touch-controls" class="touch-controls" hidden aria-label="触屏控制"><button id="touch-yes">A <span>Q</span></button><button id="look-left">环顾左侧</button><button id="look-tv">电视</button><button id="touch-no">B <span>E</span></button></nav>
  <noscript>此体验需要 JavaScript 和支持 WebGL 的浏览器。</noscript>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
